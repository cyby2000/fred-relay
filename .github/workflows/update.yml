name: Update FRED data
on:
  schedule:
    # 每天 07:00 UTC = 北京 15:00，早于面板 16:00 自动运行，保证数据新鲜
    - cron: "0 7 * * *"
  workflow_dispatch: {}      # 允许手动触发（部署后点一次，立即灌首批数据）
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch FRED series
        run: python fetch.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit & push
        run: |
          git config user.name "fred-relay[bot]"
          git config user.email "fred-relay[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: update FRED series $(date +%F)"
            git push
          fi
